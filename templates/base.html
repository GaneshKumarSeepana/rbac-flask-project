<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}RBAC System{% endblock %}</title>

    <style>
    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #f2f4f7;
    }

    header {
        background-color: #2c3e50;
        color: white;
        padding: 15px;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
    }

    .container {
        width: 420px;
        margin: 80px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    h2 {
        margin-top: 0;
        color: #2c3e50;
    }

    hr {
        border: none;
        height: 1px;
        background: #ddd;
        margin: 15px 0;
    }

    .badge {
        display: inline-block;
        padding: 5px 10px;
        margin: 4px 4px 4px 0;
        border-radius: 15px;
        font-size: 13px;
        color: white;
    }

    .read { background-color: #3498db; }
    .write { background-color: #f39c12; }
    .delete { background-color: #e74c3c; }

    .action-box {
        background: #f9fafb;
        padding: 15px;
        border-radius: 8px;
        margin-top: 10px;
    }

    .btn {
        display: inline-block;
        padding: 8px 14px;
        margin-top: 8px;
        background-color: #3498db;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-size: 14px;
    }

    .btn-danger {
        background-color: #e74c3c;
    }

    .btn:hover {
        opacity: 0.9;
    }

    .logout {
        float: right;
        font-size: 14px;
    }

    footer {
        text-align: center;
        margin-top: 40px;
        color: gray;
        font-size: 13px;
    }
</style>

</head>

<body>

<header>
    Role-Based Access Control System
</header>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

<footer>
    © 2026 RBAC Project | Secure Database Access
</footer>

</body>
</html>
